services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ${DOCKERHUB_USER:-local}/loan-api:1.0.0
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/model/model.json
      DATABASE_URL: postgresql://loan:loan_dev_password@db:5432/loans
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: loan_dev_password   # development-only password (allowed exception)
      POSTGRES_DB: loans
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loans"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
